# nginx site for CarCare. Installed by deploy/install.sh (placeholders @APP_DOMAIN@, @API_DOMAIN@).
# Get certificates with:  sudo certbot --nginx -d @APP_DOMAIN@ -d @API_DOMAIN@
# certbot adds the "listen 443 ssl" lines and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name @APP_DOMAIN@;

    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # the app forwards the client address to the API for rate limiting
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name @API_DOMAIN@;

    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:15567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
