name: CI

# Build and test only, no deployment. Deploy on the server with deploy/install.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [PostgreSql, MySql]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: "backend/**/packages.lock.json"

      # PostgreSQL 16 and MySQL 8 are preinstalled on the Ubuntu runner (no containers needed)
      - name: Start PostgreSQL
        if: matrix.database == 'PostgreSql'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE ROLE vgauto LOGIN SUPERUSER PASSWORD 'ci-password';"

      - name: Start MySQL
        if: matrix.database == 'MySql'
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE USER 'vgauto'@'%' IDENTIFIED BY 'ci-password'; GRANT ALL ON *.* TO 'vgauto'@'%'; FLUSH PRIVILEGES;"

      - name: Build
        working-directory: backend/src
        run: |
          touch VgAuto.Http.Api/appsettings.Secrets.json
          dotnet build VgAuto.sln -c Release --nologo

      - name: Test
        working-directory: backend/tests/VgAuto.Tests
        env:
          VGAUTO_TEST_DB_PROVIDER: ${{ matrix.database }}
          VGAUTO_TEST_DB_HOST: 127.0.0.1
          VGAUTO_TEST_DB_USER: vgauto
          VGAUTO_TEST_DB_PASSWORD: ci-password
        run: dotnet test -c Release --no-build --nologo --logger "console;verbosity=normal"

      - name: Check for vulnerable packages
        working-directory: backend/src
        run: |
          dotnet list VgAuto.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build (includes lint and type check)
        env:
          SESSION_SECRET: ci-session-secret-not-used-in-production
          SERVER_SECRET: ci-server-secret
          API_URL: http://localhost:15567
          NEXT_PUBLIC_API_URL: http://localhost:15567
          NEXT_PUBLIC_SESSION_TIMEOUT: "1500"
          NEXT_PUBLIC_SESSION_DIALOG_TIMEOUT: "120"
        run: npm run build

      - name: Audit production dependencies (critical only)
        run: npm audit --omit=dev --audit-level=critical
